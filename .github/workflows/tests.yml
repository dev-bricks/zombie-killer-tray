name: tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Install test tools
        run: python -m pip install pytest ruff
      - name: Install package (editable, src/ layout, T-20260926-212716751)
        run: python -m pip install -e .
      - name: Lint with Ruff
        run: python -m ruff check .
      - name: Run unit tests via unittest
        run: python -m unittest -v test_zombie_killer
      - name: Run test suite via pytest
        run: python -m pytest -ra -v .
      - name: Parse tray PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'zombie_tray.ps1'), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Validate BAT launcher
        shell: cmd
        run: start-zombie-killer-admin.bat --check
