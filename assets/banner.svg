<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <radialGradient id="greenGlow" cx="22%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="44%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>

    <!-- Character Gradients -->
    <linearGradient id="zombieSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="70%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <linearGradient id="zombie2Skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="60%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="sentryArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="cleanBeam" x1="100%" y1="30%" x2="0%" y2="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#22c55e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.14"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="400" fill="url(#bgGrad)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#greenGlow)"/>
  <rect width="1280" height="400" fill="url(#cyanGlow)"/>

  <!-- Outer Banner Border -->
  <rect x="1" y="1" width="1278" height="398" rx="8" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Circuit Trace Lines -->
  <path d="M 0 50 L 80 50 L 120 85 L 250 85" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.25"/>
  <circle cx="250" cy="85" r="3" fill="#06b6d4" opacity="0.6"/>
  <path d="M 1280 350 L 1150 350 L 1110 310 L 980 310" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.25"/>
  <circle cx="980" cy="310" r="3" fill="#10b981" opacity="0.6"/>

  <!-- ======================================================== -->
  <!-- LEFT: THE ZOMBIE PROCESSES & SENTRY REAPER               -->
  <!-- ======================================================== -->

  <!-- Safe Cleaner Beam shooting from Sentry wand towards the zombies -->
  <path d="M 285 174 L 170 120 L 150 280 Z" fill="url(#cleanBeam)"/>

  <!-- Defusing Energy Sparkles -->
  <circle cx="225" cy="155" r="2.5" fill="#67e8f9" filter="url(#neonGlow)"/>
  <circle cx="205" cy="195" r="3" fill="#4ade80" filter="url(#neonGlow)"/>
  <circle cx="240" cy="225" r="2" fill="#ffffff" filter="url(#neonGlow)"/>
  <circle cx="185" cy="255" r="2.5" fill="#38bdf8" filter="url(#neonGlow)"/>

  <!-- 1. Little Floating Zombie 2: python.exe (cute ghost process) -->
  <g id="zombie-small" transform="translate(14, 182)" filter="url(#dropShadow)">
    <!-- Process Tag -->
    <g transform="translate(0, -22)">
      <rect x="0" y="0" width="80" height="20" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
      <circle cx="8" cy="10" r="3" fill="#f59e0b"/>
      <text x="16" y="14" fill="#fbbf24" font-family="'Consolas', 'Courier New', monospace" font-size="10" font-weight="bold">python.exe</text>
    </g>

    <!-- Floating Ghost/Blob Body -->
    <path d="M 25 15 C 25 0, 68 0, 68 15 C 72 40, 76 68, 68 80 C 58 72, 50 82, 40 72 C 32 80, 22 70, 22 55 Z"
          fill="url(#zombie2Skin)" stroke="#064e3b" stroke-width="2.5"/>

    <!-- Small bolt -->
    <rect x="17" y="28" width="5" height="9" rx="2" fill="#94a3b8" stroke="#0f172a" stroke-width="1"/>
    <rect x="71" y="28" width="5" height="9" rx="2" fill="#94a3b8" stroke="#0f172a" stroke-width="1"/>

    <!-- Swirly Dizzy Eyes -->
    <circle cx="37" cy="30" r="6" fill="#020617"/>
    <circle cx="37" cy="30" r="3.5" fill="#fbbf24"/>
    <circle cx="56" cy="30" r="6" fill="#020617"/>
    <circle cx="56" cy="30" r="3.5" fill="#fbbf24"/>

    <!-- Stitch smile -->
    <path d="M 39 48 Q 47 52 55 48" fill="none" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="42" y1="46" x2="42" y2="51" stroke="#064e3b" stroke-width="2"/>
    <line x1="51" y1="46" x2="51" y2="51" stroke="#064e3b" stroke-width="2"/>
  </g>

  <!-- 2. Main Zombie Character: node.exe (Cyber Frankenstein) -->
  <g id="zombie-main" transform="translate(78, 68)" filter="url(#dropShadow)">
    <!-- Process Tag Card hovering above zombie -->
    <g transform="translate(0, -18)">
      <rect x="0" y="0" width="165" height="34" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
      <circle cx="14" cy="17" r="4" fill="#ef4444" filter="url(#neonGlow)"/>
      <text x="26" y="15" fill="#f87171" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="bold">PID: 4092 [ORPHAN]</text>
      <text x="26" y="27" fill="#94a3b8" font-family="'Consolas', 'Courier New', monospace" font-size="9">Parent: DEAD (lingering)</text>
    </g>

    <!-- Zombie Body / Developer Hoodie -->
    <path d="M 32 170 C 32 150, 48 140, 75 140 C 102 140, 118 150, 118 170 L 126 238 C 126 244, 120 248, 110 248 L 40 248 C 30 248, 24 244, 24 238 Z"
          fill="#334155" stroke="#1e293b" stroke-width="3"/>
    <!-- Torn Hoodie Patch -->
    <path d="M 44 195 L 62 185 L 56 210 Z" fill="#1e293b"/>
    <line x1="50" y1="188" x2="54" y2="198" stroke="#475569" stroke-width="2"/>

    <!-- Zombie Arms Reaching Out -->
    <path d="M 30 160 C 10 165, 0 175, 12 188 C 18 185, 26 178, 34 175 Z" fill="url(#zombieSkin)" stroke="#052e16" stroke-width="2"/>
    <path d="M 116 160 C 136 162, 148 172, 142 185 C 134 182, 124 176, 114 175 Z" fill="url(#zombieSkin)" stroke="#052e16" stroke-width="2"/>

    <!-- Zombie Head -->
    <rect x="25" y="45" width="100" height="96" rx="20" fill="url(#zombieSkin)" stroke="#052e16" stroke-width="4"/>

    <!-- CRT Frame / Screen Plate in Forehead -->
    <rect x="36" y="54" width="78" height="30" rx="6" fill="#020617" stroke="#15803d" stroke-width="2"/>
    <text x="44" y="74" fill="#4ade80" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="bold">node.exe</text>
    <circle cx="104" cy="69" r="3" fill="#22c55e" filter="url(#neonGlow)"/>

    <!-- Hair / Cyber Binary Tufts -->
    <path d="M 42 45 L 50 32 L 60 45 L 72 28 L 84 45 L 96 34 L 105 45" fill="none" stroke="#15803d" stroke-width="4" stroke-linejoin="round"/>

    <!-- Cyber Bolts on Temples -->
    <rect x="15" y="85" width="12" height="16" rx="3" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
    <rect x="123" y="85" width="12" height="16" rx="3" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>

    <!-- Mismatched Zombie Eyes -->
    <!-- Left Eye: Confused / Dizzy X -->
    <circle cx="55" cy="105" r="14" fill="#020617"/>
    <line x1="48" y1="98" x2="62" y2="112" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <line x1="62" y1="98" x2="48" y2="112" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Eye: Wide Glowing Cyan Screen Eye -->
    <circle cx="95" cy="105" r="14" fill="#020617"/>
    <circle cx="95" cy="105" r="8" fill="#38bdf8" filter="url(#neonGlow)"/>
    <circle cx="97" cy="103" r="3" fill="#ffffff"/>

    <!-- Stitched Droopy Mouth -->
    <path d="M 52 128 Q 75 138 98 126" fill="none" stroke="#052e16" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="124" x2="60" y2="134" stroke="#052e16" stroke-width="3"/>
    <line x1="75" y1="127" x2="75" y2="138" stroke="#052e16" stroke-width="3"/>
    <line x1="90" y1="123" x2="90" y2="134" stroke="#052e16" stroke-width="3"/>
  </g>

  <!-- 3. The Sentry Cleaner / Guardian Robot (The Tray Tool) -->
  <g id="sentry-character" transform="translate(305, 75)" filter="url(#dropShadow)">
    <!-- Hover Thruster Glow -->
    <ellipse cx="60" cy="235" rx="28" ry="8" fill="#38bdf8" opacity="0.4" filter="url(#neonGlow)"/>
    <ellipse cx="60" cy="235" rx="14" ry="4" fill="#ffffff" opacity="0.8"/>

    <!-- Floating Shield Body -->
    <path d="M 20 60 C 20 50, 45 40, 60 40 C 75 40, 100 50, 100 60 C 100 130, 80 180, 60 210 C 40 180, 20 130, 20 60 Z"
          fill="url(#sentryArmor)" stroke="#0284c7" stroke-width="3"/>

    <!-- Glowing Heart / Safe Clean Core Badge -->
    <path d="M 34 75 C 34 68, 50 62, 60 62 C 70 62, 86 68, 86 75 C 86 120, 72 155, 60 175 C 48 155, 34 120, 34 75 Z"
          fill="url(#shieldGrad)"/>

    <!-- White Checkmark in Shield (Safe Targeted Protection) -->
    <path d="M 48 105 L 56 113 L 73 95" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cute Sentry Head / Visor -->
    <rect x="32" y="10" width="56" height="34" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Cheerful Glowing Blue Eyes -->
    <circle cx="48" cy="27" r="5" fill="#38bdf8" filter="url(#neonGlow)"/>
    <circle cx="49" cy="26" r="2" fill="#ffffff"/>
    <circle cx="72" cy="27" r="5" fill="#38bdf8" filter="url(#neonGlow)"/>
    <circle cx="73" cy="26" r="2" fill="#ffffff"/>

    <!-- Sentry Antenna -->
    <line x1="60" y1="10" x2="60" y2="0" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="60" cy="0" r="4" fill="#22c55e" filter="url(#neonGlow)"/>

    <!-- Sentry Cleaner Blaster (Safe Reaper Wand pointing left) -->
    <g transform="translate(-18, 92)">
      <rect x="0" y="4" width="28" height="14" rx="4" fill="#475569" stroke="#1e293b" stroke-width="2"/>
      <circle cx="3" cy="11" r="5" fill="#38bdf8" filter="url(#neonGlow)"/>
    </g>

    <!-- Status Bubble -->
    <g transform="translate(-15, -34)">
      <rect x="0" y="0" width="150" height="28" rx="14" fill="#020617" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="14" cy="14" r="5" fill="#10b981" filter="url(#neonGlow)"/>
      <text x="26" y="18" fill="#34d399" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="bold">SURGICAL REAP: SAFE</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- RIGHT: TITLE, VALUE PROP & TELEMETRY CARD               -->
  <!-- ======================================================== -->

  <g transform="translate(485, 42)">
    <!-- Top Ecosystem Breadcrumb & Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="205" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#06b6d4"/>
      <text x="26" y="17" fill="#cbd5e1" font-family="'Consolas', 'Courier New', monospace" font-size="11">dev-bricks / zombie-killer-tray</text>

      <rect x="218" y="0" width="175" height="26" rx="13" fill="#022c22" stroke="#059669" stroke-width="1"/>
      <circle cx="232" cy="13" r="4" fill="#10b981" filter="url(#neonGlow)"/>
      <text x="244" y="17" fill="#34d399" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="bold">WINDOWS TRAY TOOL</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="70" fill="#f8fafc" font-family="'Segoe UI', -apple-system, system-ui, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      ZOMBIE KILLER <tspan fill="#4ade80">TRAY</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="100" fill="#94a3b8" font-family="'Segoe UI', -apple-system, system-ui, sans-serif" font-size="15" font-weight="400">
      Conservative Windows system tray reaper for orphaned MCP &amp; language servers.
    </text>

    <!-- Sleek Terminal Box -->
    <g transform="translate(0, 118)" filter="url(#dropShadow)">
      <!-- Terminal Frame -->
      <rect x="0" y="0" width="730" height="144" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

      <!-- Title Bar -->
      <rect x="0" y="0" width="730" height="32" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <!-- Window Controls -->
      <circle cx="18" cy="16" r="5" fill="#f43f5e" opacity="0.8"/>
      <circle cx="34" cy="16" r="5" fill="#fbbf24" opacity="0.8"/>
      <circle cx="50" cy="16" r="5" fill="#22c55e" opacity="0.8"/>
      <text x="70" y="20" fill="#64748b" font-family="'Consolas', 'Courier New', monospace" font-size="11">zombie_tray.ps1 (Safe Parent-Death Watcher)</text>

      <g transform="translate(18, 38)">
        <!-- Line 1: Scan -->
        <text x="0" y="18" fill="#38bdf8" font-family="'Consolas', 'Courier New', monospace" font-size="12">> scan --orphaned-mcp-servers</text>

        <!-- Line 2: Detected node -->
        <text x="0" y="38" fill="#f87171" font-family="'Consolas', 'Courier New', monospace" font-size="12">  [DETECTED]</text>
        <text x="95" y="38" fill="#e2e8f0" font-family="'Consolas', 'Courier New', monospace" font-size="12">node.exe (PID 4092) · Parent dead · memory lingering</text>

        <!-- Line 3: Detected python -->
        <text x="0" y="58" fill="#fbbf24" font-family="'Consolas', 'Courier New', monospace" font-size="12">  [VERIFIED]</text>
        <text x="95" y="58" fill="#cbd5e1" font-family="'Consolas', 'Courier New', monospace" font-size="12">Allowlist match · PID reuse checked · No blanket tree-kill</text>

        <!-- Line 4: Result -->
        <text x="0" y="78" fill="#4ade80" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="bold">  [REAPED]  </text>
        <text x="95" y="78" fill="#86efac" font-family="'Consolas', 'Courier New', monospace" font-size="12">Memory freed · Active editors &amp; shells unaffected</text>
      </g>
    </g>

    <!-- Bottom Feature Badges -->
    <g transform="translate(0, 280)">
      <!-- Badge 1: 100% Local - No Network -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="195" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="10" y="17" fill="#38bdf8" font-family="'Consolas', 'Courier New', monospace" font-size="10.5">🔒 100% local - no network</text>
      </g>

      <!-- Badge 2: No Blanket Tree-Kill -->
      <g transform="translate(205, 0)">
        <rect x="0" y="0" width="180" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="10" y="17" fill="#34d399" font-family="'Consolas', 'Courier New', monospace" font-size="10.5">🛡️ No blanket tree-kill</text>
      </g>

      <!-- Badge 3: Parent-Death Watch -->
      <g transform="translate(395, 0)">
        <rect x="0" y="0" width="170" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="10" y="17" fill="#a78bfa" font-family="'Consolas', 'Courier New', monospace" font-size="10.5">⚡ Parent-Death Watch</text>
      </g>

      <!-- Badge 4: MIT License -->
      <g transform="translate(575, 0)">
        <rect x="0" y="0" width="155" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="10" y="17" fill="#cbd5e1" font-family="'Consolas', 'Courier New', monospace" font-size="10.5">⚖️ MIT · Open Source</text>
      </g>
    </g>
  </g>
</svg>